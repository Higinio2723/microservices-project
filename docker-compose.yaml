services:
  msvc-usuarios:
    container_name: msvc-registry-server
    image: msvc-registry-server:latest
#    build:
#      context: ./
#      dockerfile: ./msvc-usuarios/Dockerfile
    ports:
      - "8761:8761"
    environment:
      PORT: 8761
    networks:
      - spring
    restart: always


  msvc-gateway-server:
    container_name: msvc-gateway-server
    image: msvc-gateway-server:latest
#    build:
#      context: ./
#      dockerfile: ./msvc-gateway-server/Dockerfile
    ports:
      - "4040:4040"
    environment:
      PORT: 4040
      EUREKA_URL: http://msvc-registry-server:8761
    networks:
      - spring
    restart: always

  msvc-employee:
    container_name: msvc-employee
    image: msvc-employee:latest
#    build:
#      context: ./
#      dockerfile: ./msvc-employee/Dockerfile
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      EUREKA_URL: http://msvc-registry-server:8761
    networks:
      - spring
    restart: always

networks:
    spring:
      driver: bridge