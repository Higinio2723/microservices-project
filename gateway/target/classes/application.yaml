spring:
  application:
    name: gateway
  profiles:
    default: eureka-on
    #default: oauth2
server:
  port: 4040
eureka:
  client:
    # Habilitar la obtención del registry para que lb://nombre-servicio funcione
    fetch-registry: true
    # register-with-eureka por defecto es true; se incluye explícitamente para claridad
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Niveles de logging para diagnóstico de rutas y resolución de instancias
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.client.discovery: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty.http.client: DEBUG

